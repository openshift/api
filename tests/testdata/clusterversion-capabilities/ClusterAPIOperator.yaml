            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.15
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.16 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.16
      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.16 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.16
            additionalEnabledCapabilities:
            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.16
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.17 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:

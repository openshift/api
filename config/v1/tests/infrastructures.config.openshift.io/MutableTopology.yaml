apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- MutableTopology
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure without controlPlaneTopology in spec
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
  onUpdate:
    - name: Should allow updating spec controlPlaneTopology from SingleReplica to HighlyAvailable when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when it was not previously set and status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should not allow changing spec controlPlaneTopology from HighlyAvailable to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow cancelling a requested transition by matching the SingleReplica status topology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow removing spec controlPlaneTopology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow keeping spec controlPlaneTopology unchanged when status no longer matches
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
          cloudConfig:
            name: cloud-config
        status:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
          cloudConfig:
            name: cloud-config
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow completing a transition while retaining the requested spec topology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: External
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: External
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: External
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: External
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should not allow setting spec controlPlaneTopology before status topology is reported
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should not allow using an unpersisted status topology to bypass spec validation
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow updating Infrastructure status without topologyTransitionStatus
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow empty transition status before evaluation
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions: []
            conditions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions: []
            conditions: []
    - name: Should allow omitting transitions when topologyTransitionStatus is set
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            conditions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions: []
    - name: Should allow omitting conditions when topologyTransitionStatus is set
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions: []
    - name: Should allow reporting a successful evaluation with no supported transitions
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: No transitions are supported
            transitions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: No transitions are supported
            transitions: []
    - name: Should allow evaluation and completion conditions before their state is known
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotEvaluated
              message: Transition checks have not run
            - type: TopologyTransitionCompleted
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotRequested
              message: No transition has been requested
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotEvaluated
              message: Transition checks have not run
            - type: TopologyTransitionCompleted
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotRequested
              message: No transition has been requested
    - name: Should reject an unsupported top-level condition type
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionAvailable
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: PreflightCheckFailed
              message: A preflight check failed
      expectedStatusError: "conditions may only contain TopologyTransitionsEvaluated and TopologyTransitionCompleted"
    - name: Should reject an unsupported condition even when a supported top-level condition is present
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: PreflightCheckPassed
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: PrerequisitesMet
              message: All prerequisites are met
      expectedStatusError: "conditions may only contain TopologyTransitionsEvaluated and TopologyTransitionCompleted"
    - name: Should allow reporting a transition in progress with failing evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
            conditions:
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying topology changes
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
            conditions:
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying topology changes
    - name: Should require an availability condition among transition evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
      expectedStatusError: "evaluations must contain TopologyTransitionAvailable"
    - name: Should not allow removing the availability condition from transition evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
              - type: PreflightCheckPassed
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisitesMet
                message: All prerequisites are met
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisitesMet
                message: All prerequisites are met
      expectedStatusError: "evaluations must contain TopologyTransitionAvailable"
    - name: Should allow evaluation and completion conditions with an available transition
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: TransitionComplete
              message: Transition completed
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: TransitionComplete
              message: Transition completed
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
    - name: Should allow stale transition evaluations until the evaluation condition is reported
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
    - name: Should allow updating a transition from unavailable to available
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: The transition is unavailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:

  - name: Should not be able to create an Ingress with the unsupported Lt toleration operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Lt
              value: "1"
    expectedError: "tolerations operator must be 'Exists' or 'Equal'"
  - name: Should not be able to create an Ingress with tolerationSeconds and no effect
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              tolerationSeconds: 60
    expectedError: "tolerations effect must be 'NoExecute' when tolerationSeconds is set"
  - name: Should not be able to create an Ingress with a toleration that omits both key and operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - effect: NoSchedule
    expectedError: "tolerations key must be non-empty"
  onUpdate:
  - name: Should be able to update the canary tolerations of an Ingress
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
    updated: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/other-taint
              operator: Exists
              effect: NoExecute
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/other-taint
              operator: Exists
              effect: NoExecute

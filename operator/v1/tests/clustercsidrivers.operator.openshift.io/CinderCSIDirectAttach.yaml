  - name: Should require Cinder configuration for the Cinder discriminator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
    expectedError: cinder must be set if driverType is Cinder
  - name: Should reject cinder with discriminator empty
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: ''
          cinder:
            attachMode: Direct
    expectedError: cinder must be set if driverType is Cinder
  - name: Should reject cinder with discriminator AWS
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver

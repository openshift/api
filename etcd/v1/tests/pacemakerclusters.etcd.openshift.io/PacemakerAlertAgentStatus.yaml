    - name: Should reject Pending with a known condition status
      initial: |
        apiVersion: etcd.openshift.io/v1
        kind: PacemakerCluster
        metadata:
          name: cluster
      updated: |
        apiVersion: etcd.openshift.io/v1
        kind: PacemakerCluster
        metadata:
          name: cluster
        status:
          conditions:
            - &condition {type: Healthy, status: "True", lastTransitionTime: "2024-01-01T00:00:00Z", reason: AsExpected, message: "Healthy"}
            - {<<: *condition, type: InService}
            - {<<: *condition, type: NodeCountAsExpected}
          lastUpdated: "2024-01-01T00:00:01Z"
          nodes:
            - nodeName: master-0.example.com
              addresses:
                - {type: InternalIP, address: "192.168.1.1"}
              conditions:
                - *condition
                - {<<: *condition, type: Online}
                - {<<: *condition, type: InService}
                - {<<: *condition, type: Active}
                - {<<: *condition, type: Ready}
                - {<<: *condition, type: Clean}
                - {<<: *condition, type: Member}
                - {<<: *condition, type: FencingAvailable}
                - {<<: *condition, type: FencingHealthy}
              resources:
                - &resource
                  name: Kubelet
                  conditions:
                    - *condition
                    - {<<: *condition, type: InService}
                    - {<<: *condition, type: Managed}
                    - {<<: *condition, type: Enabled}
                    - {<<: *condition, type: Operational}
                    - {<<: *condition, type: Active}
                    - {<<: *condition, type: Started}
                    - {<<: *condition, type: Schedulable}
                - {<<: *resource, name: Etcd}
              fencingAgents: []
              alertAgents:
                - name: TaintAlertAgent
                  conditions:
                    - *condition
                    - {<<: *condition, type: Configured, reason: Pending}
                    - {<<: *condition, type: Available}
                - name: UntaintAlertAgent
                  conditions:
                    - *condition
                    - {<<: *condition, type: Configured}
                    - {<<: *condition, type: Available}
      expectedStatusError: "reason Pending is only valid when status is Unknown"


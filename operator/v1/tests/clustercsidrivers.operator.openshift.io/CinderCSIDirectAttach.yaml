  - name: Should allow a 63-character source name and 253-character Secret name
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:

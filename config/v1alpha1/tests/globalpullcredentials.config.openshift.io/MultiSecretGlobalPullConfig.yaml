apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "GlobalPullCredential"
crdName: globalpullcredentials.config.openshift.io
featureGates:
- MultiSecretGlobalPullConfig
tests:
  onCreate:
    - name: Should be able to create a minimal GlobalPullCredential
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
    - name: Should be able to create a GlobalPullCredential with a host:port hostname
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-example-registry
        spec:
          hostname: registry.example.com:5000
          auth:
            username: cm9ib3Q=
            password: czNjcmV0LXRva2Vu
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-example-registry
        spec:
          hostname: registry.example.com:5000
          auth:
            username: cm9ib3Q=
            password: czNjcmV0LXRva2Vu
    - name: Should not allow a missing hostname
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expectedError: "spec.hostname: Required value"
    - name: Should not allow a missing auth
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
      expectedError: "spec.auth: Required value"
    - name: Should not allow an empty hostname
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: ""
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expectedError: "Invalid value: \"\": spec.hostname in body should be at least 1 chars long"
    - name: Should not allow an invalid hostname
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: "not a valid host!!"
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expectedError: "hostname must start and end with an alphanumeric character, and must only contain alphanumeric characters, '-' or '.'"
    - name: Should not allow an empty DNS label in the hostname
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: foo..bar
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expectedError: "hostname must start and end with an alphanumeric character, and must only contain alphanumeric characters, '-' or '.'"
    - name: Should not allow a hostname port above 65535
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: registry.example.com:99999
          auth:
            username: dXNlcg==
            password: cGFzcw==
      expectedError: "port must be between 1 and 65535"
    - name: Should not allow a malformed base64 username
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: "not-base64!"
            password: cGFzcw==
      expectedError: "spec.auth.username in body must be of type byte: \"not-base64!\""
    - name: Should not allow a missing username
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            password: cGFzcw==
      expectedError: "spec.auth.username: Required value"
    - name: Should not allow an empty username
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: ""
            password: cGFzcw==
      expectedError: "Invalid value: \"\": spec.auth.username in body should be at least 1 chars long"
    - name: Should not allow a missing password
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
      expectedError: "spec.auth.password: Required value"
    - name: Should not allow an empty password
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: ""
      expectedError: "Invalid value: \"\": spec.auth.password in body should be at least 1 chars long"
  onUpdate:
    - name: Should allow updating the username and password for an existing GlobalPullCredential
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: bmV3dXNlcg==
            password: bmV3cGFzcw==
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: bmV3dXNlcg==
            password: bmV3cGFzcw==
    - name: Should allow reporting one Applied condition
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
        status:
          conditions:
          - type: Applied
            status: "True"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: Merged
            message: Credential merged into pull-secret-merged
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
        status:
          conditions:
          - type: Applied
            status: "True"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: Merged
            message: Credential merged into pull-secret-merged
    - name: Should allow reporting baseline precedence with Applied=False
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
        status:
          conditions:
          - type: Applied
            status: "False"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: BaselinePrecedence
            message: baseline pull-secret credential is used instead
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
        status:
          conditions:
          - type: Applied
            status: "False"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: BaselinePrecedence
            message: baseline pull-secret credential is used instead
    - name: Should reject more than one status condition
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: GlobalPullCredential
        metadata:
          name: team-a-quay
        spec:
          hostname: quay.io
          auth:
            username: dXNlcg==
            password: cGFzcw==
        status:
          conditions:
          - type: Applied
            status: "True"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: Merged
            message: Credential merged into pull-secret-merged
          - type: Degraded
            status: "True"
            observedGeneration: 1
            lastTransitionTime: "2026-01-01T00:00:00Z"
            reason: Merged
            message: Credential merged into pull-secret-merged
      expectedStatusError: "must have at most 1 items"

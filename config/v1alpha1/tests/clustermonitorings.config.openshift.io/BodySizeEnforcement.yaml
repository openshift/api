apiVersion: apiextensions.k8s.io/v1
name: "ClusterMonitoring body size enforcement"
crdName: clustermonitorings.config.openshift.io
featureGate: ClusterMonitoringConfig
tests:
  onCreate:
    - name: Should accept Automatic for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Automatic
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Automatic
    - name: Should accept None for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: None
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: None
    - name: Should accept Custom with minimum for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 10240
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 10240
    - name: Should accept Custom with maximum for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 1073741824
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 1073741824
    - name: Should accept omitted bodySizeEnforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            logLevel: Info
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            logLevel: Info
    - name: Should reject Custom without custom for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
      expectedError: "custom is required when mode is Custom"
    - name: Should reject Custom with empty custom for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom: {}
      expectedError: "maxSizeBytes"
    - name: Should reject Automatic with custom for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Automatic
              custom:
                maxSizeBytes: 4194304
      expectedError: "custom is required when mode is Custom, and forbidden otherwise"
    - name: Should reject None with custom for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: None
              custom:
                maxSizeBytes: 4194304
      expectedError: "custom is required when mode is Custom, and forbidden otherwise"
    - name: Should reject missing mode for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              custom:
                maxSizeBytes: 4194304
      expectedError: "mode"
    - name: Should reject unknown mode for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Unknown
      expectedError: "Unsupported value"
    - name: Should reject empty mode for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: ""
      expectedError: "Unsupported value"
    - name: Should reject Custom below minimum for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 10239
      expectedError: "greater than or equal to 10240"
    - name: Should reject Custom above maximum for scrape body size enforcement
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ClusterMonitoring
        spec:
          userDefined:
            mode: Disabled
          prometheusConfig:
            bodySizeEnforcement:
              mode: Custom
              custom:
                maxSizeBytes: 1073741825
      expectedError: "less than or equal to 1073741824"

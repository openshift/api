apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/2972
    api.openshift.io/filename-cvo-runlevel: "0000_80"
    api.openshift.io/filename-operator: machine-config
    api.openshift.io/filename-ordering: "01"
    feature-gate.release.openshift.io/BGPBasedVIPManagement: "true"
  labels:
    openshift.io/operator-managed: ""
  name: bgpvipconfigs.machineconfiguration.openshift.io
spec:
  group: machineconfiguration.openshift.io
  names:
    kind: BGPVIPConfig
    listKind: BGPVIPConfigList
    plural: bgpvipconfigs
    singular: bgpvipconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPVIPConfig carries the BGP peering configuration for BGP-based VIP
          management (enhancement openshift/enhancements#1982). It is a singleton
          named "cluster", generated by the installer from
          platform.baremetal.bgpVIPConfig in the install-config, and may be edited
          day-2 to reconfigure peering.

          Compatibility level 4: No compatibility is provided, the API can change at any point for any reason. These capabilities should not be used by applications needing long term support.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired BGP VIP peering configuration.
            properties:
              communities:
                description: |-
                  communities are BGP community strings attached to the VIP
                  advertisements: "n:n" classic communities (RFC 1997) where each
                  segment is a 16-bit value between 0 and 65535, or "n:n:n" large
                  communities (RFC 8092) where each segment is a 32-bit value between
                  0 and 4294967295. When omitted, no communities are attached. Each
                  entry must be colon-separated decimal numbers without leading zeros,
                  between 3 and 32 characters long; when set, between 1 and 8 entries.
                items:
                  maxLength: 32
                  minLength: 3
                  pattern: ^(0|[1-9]\d*)(:(0|[1-9]\d*)){1,2}$
                  type: string
                  x-kubernetes-validations:
                  - message: classic community (n:n) segments must be between 0 and
                      65535; large community (n:n:n) segments must be between 0 and
                      4294967295
                    rule: 'self.split('':'').size() == 2 ? self.split('':'').all(s,
                      s.size() <= 5 && int(s) <= 65535) : self.split('':'').all(s,
                      s.size() <= 10 && int(s) <= 4294967295)'
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              defaultPeers:
                description: |-
                  defaultPeers are the BGP peers every node establishes sessions with,
                  unless the node is named in hostOverrides. Must contain between 1 and
                  16 peers, unique by peerAddress.
                items:
                  description: BGPVIPPeer describes one BGP peer.
                  properties:
                    bfd:
                      description: |-
                        bfd determines whether the session is backed by BFD fast failure
                        detection. When set to "Enabled", a BFD session is established with
                        the peer and BGP reacts to BFD failure detection. When set to
                        "Disabled", failure detection relies on the BGP hold timer alone.
                        When omitted, BFD is disabled; this default is subject to change over
                        time.
                      enum:
                      - Enabled
                      - Disabled
                      type: string
                    ebgpMultiHop:
                      description: |-
                        ebgpMultiHop determines whether the session may cross multiple hops.
                        When set to "Enabled", the session may be established with a peer
                        several router hops away. When set to "Disabled", the peer must be
                        directly connected. When omitted, multihop is disabled; this default
                        is subject to change over time.
                      enum:
                      - Enabled
                      - Disabled
                      type: string
                    holdTimeSeconds:
                      description: |-
                        holdTimeSeconds is the BGP hold time in seconds, either 0 or between
                        3 and 65535 (RFC 4271 requires a hold time of 0 or at least 3
                        seconds). When omitted or 0, the FRR default is used; this is subject
                        to change over time. When both holdTimeSeconds and
                        keepaliveTimeSeconds are set and non-zero, holdTimeSeconds must be at
                        least 3 times keepaliveTimeSeconds.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                      x-kubernetes-validations:
                      - message: holdTimeSeconds must be 0 or at least 3
                        rule: self == 0 || self >= 3
                    keepaliveTimeSeconds:
                      description: |-
                        keepaliveTimeSeconds is the BGP keepalive interval in seconds,
                        between 0 and 65535. When omitted or 0, the FRR default is used; this
                        is subject to change over time. When both holdTimeSeconds and
                        keepaliveTimeSeconds are set and non-zero, holdTimeSeconds must be at
                        least 3 times keepaliveTimeSeconds.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    passwordSecret:
                      description: |-
                        passwordSecret references the Secret carrying the TCP MD5 password
                        (RFC 2385) for the session. The Secret must be of type
                        kubernetes.io/basic-auth, live in the openshift-config namespace, and
                        carry the password in its "password" key (at most 80 bytes, the
                        kernel's TCP MD5 limit). The Secret type, key, and size requirements
                        are not validated by the API server; the consumers validate them when
                        resolving the reference and must never surface the Secret contents in
                        status, events, or logs. Passwords are never stored in this API. When
                        omitted, the session is unauthenticated.
                      properties:
                        name:
                          description: |-
                            name is the metadata.name of the referenced Secret in the
                            openshift-config namespace. Must be a non-empty RFC 1123 subdomain of
                            at most 253 characters with dot-separated labels of at most 63
                            characters each.
                          maxLength: 253
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: name must be an RFC 1123 subdomain with labels
                              of at most 63 characters
                            rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                      required:
                      - name
                      type: object
                    peerASN:
                      description: |-
                        peerASN is the autonomous system number of the peer. Must be
                        between 1 and 4294967295.
                      format: int64
                      maximum: 4294967295
                      minimum: 1
                      type: integer
                    peerAddress:
                      description: |-
                        peerAddress is the IP address of the BGP peer (IPv4 or IPv6) in
                        canonical form (lowercase, no leading zeros, IPv6 zero-compressed),
                        between 2 and 45 characters; the session's address family follows the
                        address family of this value. Canonical form is required so that two
                        spellings of one address cannot form duplicate peers.
                      maxLength: 45
                      minLength: 2
                      type: string
                      x-kubernetes-validations:
                      - message: peerAddress must be a valid IP address in canonical
                          form
                        rule: isIP(self) && ip.isCanonical(self)
                    port:
                      description: |-
                        port is the TCP port of the BGP session, between 1 and 65535. When
                        omitted, port 179 is used; this default is applied by the consumers
                        and is subject to change over time.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - peerASN
                  - peerAddress
                  type: object
                  x-kubernetes-validations:
                  - message: holdTimeSeconds must be at least 3 times keepaliveTimeSeconds
                    rule: '!(has(self.holdTimeSeconds) && has(self.keepaliveTimeSeconds))
                      || self.holdTimeSeconds == 0 || self.keepaliveTimeSeconds ==
                      0 || self.holdTimeSeconds >= 3 * self.keepaliveTimeSeconds'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - peerAddress
                x-kubernetes-list-type: map
              hostOverrides:
                description: |-
                  hostOverrides replaces (does not merge with) defaultPeers for the
                  named nodes. Only the per-node peer file rendered by the
                  machine-config-operator consumes overrides; the cluster-wide session
                  configuration rendered by the cluster-network-operator uses
                  defaultPeers. When omitted, all nodes use defaultPeers; when set,
                  between 1 and 256 entries, unique by hostname.
                items:
                  description: BGPVIPHostPeers is a per-node replacement peer list.
                  properties:
                    hostname:
                      description: |-
                        hostname of the node this override applies to, as a non-empty RFC
                        1123 subdomain of at most 253 characters with dot-separated labels of
                        at most 63 characters each. It is compared verbatim against
                        the hostname the node resolves for itself (as rendered into the
                        per-node peer file), so a short name and its fully qualified form are
                        distinct entries and only the exact match applies.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: hostname must be an RFC 1123 subdomain with labels
                          of at most 63 characters
                        rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                    peers:
                      description: |-
                        peers replaces defaultPeers for this node. Must contain between 1 and
                        16 peers, unique by peerAddress.
                      items:
                        description: BGPVIPPeer describes one BGP peer.
                        properties:
                          bfd:
                            description: |-
                              bfd determines whether the session is backed by BFD fast failure
                              detection. When set to "Enabled", a BFD session is established with
                              the peer and BGP reacts to BFD failure detection. When set to
                              "Disabled", failure detection relies on the BGP hold timer alone.
                              When omitted, BFD is disabled; this default is subject to change over
                              time.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          ebgpMultiHop:
                            description: |-
                              ebgpMultiHop determines whether the session may cross multiple hops.
                              When set to "Enabled", the session may be established with a peer
                              several router hops away. When set to "Disabled", the peer must be
                              directly connected. When omitted, multihop is disabled; this default
                              is subject to change over time.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          holdTimeSeconds:
                            description: |-
                              holdTimeSeconds is the BGP hold time in seconds, either 0 or between
                              3 and 65535 (RFC 4271 requires a hold time of 0 or at least 3
                              seconds). When omitted or 0, the FRR default is used; this is subject
                              to change over time. When both holdTimeSeconds and
                              keepaliveTimeSeconds are set and non-zero, holdTimeSeconds must be at
                              least 3 times keepaliveTimeSeconds.
                            format: int32
                            maximum: 65535
                            minimum: 0
                            type: integer
                            x-kubernetes-validations:
                            - message: holdTimeSeconds must be 0 or at least 3
                              rule: self == 0 || self >= 3
                          keepaliveTimeSeconds:
                            description: |-
                              keepaliveTimeSeconds is the BGP keepalive interval in seconds,
                              between 0 and 65535. When omitted or 0, the FRR default is used; this
                              is subject to change over time. When both holdTimeSeconds and
                              keepaliveTimeSeconds are set and non-zero, holdTimeSeconds must be at
                              least 3 times keepaliveTimeSeconds.
                            format: int32
                            maximum: 65535
                            minimum: 0
                            type: integer
                          passwordSecret:
                            description: |-
                              passwordSecret references the Secret carrying the TCP MD5 password
                              (RFC 2385) for the session. The Secret must be of type
                              kubernetes.io/basic-auth, live in the openshift-config namespace, and
                              carry the password in its "password" key (at most 80 bytes, the
                              kernel's TCP MD5 limit). The Secret type, key, and size requirements
                              are not validated by the API server; the consumers validate them when
                              resolving the reference and must never surface the Secret contents in
                              status, events, or logs. Passwords are never stored in this API. When
                              omitted, the session is unauthenticated.
                            properties:
                              name:
                                description: |-
                                  name is the metadata.name of the referenced Secret in the
                                  openshift-config namespace. Must be a non-empty RFC 1123 subdomain of
                                  at most 253 characters with dot-separated labels of at most 63
                                  characters each.
                                maxLength: 253
                                minLength: 1
                                type: string
                                x-kubernetes-validations:
                                - message: name must be an RFC 1123 subdomain with
                                    labels of at most 63 characters
                                  rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                            required:
                            - name
                            type: object
                          peerASN:
                            description: |-
                              peerASN is the autonomous system number of the peer. Must be
                              between 1 and 4294967295.
                            format: int64
                            maximum: 4294967295
                            minimum: 1
                            type: integer
                          peerAddress:
                            description: |-
                              peerAddress is the IP address of the BGP peer (IPv4 or IPv6) in
                              canonical form (lowercase, no leading zeros, IPv6 zero-compressed),
                              between 2 and 45 characters; the session's address family follows the
                              address family of this value. Canonical form is required so that two
                              spellings of one address cannot form duplicate peers.
                            maxLength: 45
                            minLength: 2
                            type: string
                            x-kubernetes-validations:
                            - message: peerAddress must be a valid IP address in canonical
                                form
                              rule: isIP(self) && ip.isCanonical(self)
                          port:
                            description: |-
                              port is the TCP port of the BGP session, between 1 and 65535. When
                              omitted, port 179 is used; this default is applied by the consumers
                              and is subject to change over time.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - peerASN
                        - peerAddress
                        type: object
                        x-kubernetes-validations:
                        - message: holdTimeSeconds must be at least 3 times keepaliveTimeSeconds
                          rule: '!(has(self.holdTimeSeconds) && has(self.keepaliveTimeSeconds))
                            || self.holdTimeSeconds == 0 || self.keepaliveTimeSeconds
                            == 0 || self.holdTimeSeconds >= 3 * self.keepaliveTimeSeconds'
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - peerAddress
                      x-kubernetes-list-type: map
                  required:
                  - hostname
                  - peers
                  type: object
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - hostname
                x-kubernetes-list-type: map
              localASN:
                description: |-
                  localASN is the autonomous system number the cluster's FRR instances
                  run under. Must be between 1 and 4294967295 (int64 because valid ASNs
                  exceed int32 range).
                format: int64
                maximum: 4294967295
                minimum: 1
                type: integer
            required:
            - defaultPeers
            - localASN
            type: object
          status:
            description: status reports the consumers' progress applying the configuration.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions reports the state of processing the configuration; when
                  set, between 1 and 8 entries. Known
                  condition types are "Rendered" (the machine-config-operator has
                  rendered the per-node peer configuration) and "SessionsConfigured"
                  (the cluster-network-operator has rendered the FRR session
                  configuration for application). SessionsConfigured does not assert
                  that the generated FRRConfiguration was accepted by the frr-k8s
                  admission webhook or applied on the nodes.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the generation most recently processed by the
                  machine-config-operator, at least 1 when set. The
                  cluster-network-operator's progress is reported by the
                  observedGeneration of the "SessionsConfigured" condition instead; it
                  does not write this field.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
        x-kubernetes-validations:
        - message: bgpvipconfig is a singleton, .metadata.name must be 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}

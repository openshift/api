apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- MutableTopology
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure without controlPlaneTopology in spec
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: External
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "External": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to DualReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: DualReplica
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "DualReplica": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to HighlyAvailableArbiter
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailableArbiter
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "HighlyAvailableArbiter": supported values: "HighlyAvailable", "SingleReplica"'
  onUpdate:
    - name: Should allow updating spec controlPlaneTopology from SingleReplica to HighlyAvailable when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when it was not previously set and status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow removing spec controlPlaneTopology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow keeping spec controlPlaneTopology unchanged
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow updating spec controlPlaneTopology to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should allow controlPlaneTopologyTransitions to remain omitted, representing that the controller has not yet completed its first evaluation
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow explicitly setting controlPlaneTopologyTransitions to an empty list, carrying the same meaning as omitting it
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          controlPlaneTopologyTransitions: []
    - name: Should allow controlPlaneTopologyTransitions to remain omitted when status.controlPlaneTopology is outside the source/target enum (e.g. HighlyAvailableArbiter)
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailableArbiter
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailableArbiter
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailableArbiter
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting controlPlaneTopologyTransitions to an Available entry with no reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Available
    - name: Should allow setting controlPlaneTopologyTransitions to an Unavailable entry including reason and message
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: PreflightCheckFailed
            message: "etcd does not have quorum: need 3 voting members, have 1"
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: PreflightCheckFailed
            message: "etcd does not have quorum: need 3 voting members, have 1"
    - name: Should allow setting controlPlaneTopologyTransitions to an Unknown entry with a reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unknown
            reason: EvaluationPending
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unknown
            reason: EvaluationPending
    - name: Should allow setting every schema-permitted target for the current source in controlPlaneTopologyTransitions as a MaxItems boundary test
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: SingleReplica
            availability: Available
          - source: SingleReplica
            target: HighlyAvailable
            availability: Available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: SingleReplica
            availability: Available
          - source: SingleReplica
            target: HighlyAvailable
            availability: Available
    - name: Should not allow a controlPlaneTopologyTransitions entry whose source differs from status controlPlaneTopology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: HighlyAvailable
            target: SingleReplica
            availability: Available
      expectedStatusError: "transition sources must match status.controlPlaneTopology"
    - name: Should not allow a controlPlaneTopologyTransitions entry with an invalid source
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: External
            target: HighlyAvailable
            availability: Available
      expectedStatusError: 'status.controlPlaneTopologyTransitions[0].source: Unsupported value: "External": supported values: "SingleReplica", "HighlyAvailable"'
    - name: Should not allow a controlPlaneTopologyTransitions entry with an invalid target
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: DualReplica
            availability: Available
      expectedStatusError: 'status.controlPlaneTopologyTransitions[0].target: Unsupported value: "DualReplica": supported values: "SingleReplica", "HighlyAvailable"'
    - name: Should not allow a controlPlaneTopologyTransitions entry with an invalid availability
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Pending
      expectedStatusError: 'status.controlPlaneTopologyTransitions[0].availability: Unsupported value: "Pending": supported values: "Available", "Unavailable", "Unknown"'
    - name: Should not allow an Unavailable controlPlaneTopologyTransitions entry without a reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
      expectedStatusError: "reason is required when availability is not Available"
    - name: Should not allow an Unknown controlPlaneTopologyTransitions entry without a reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unknown
      expectedStatusError: "reason is required when availability is not Available"
    - name: Should not allow a controlPlaneTopologyTransitions entry with a lowercase reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: preflightCheckFailed
      expectedStatusError: "reason must be CamelCase, matching ^[A-Z][A-Za-z0-9]*$"
    - name: Should not allow a controlPlaneTopologyTransitions entry with an empty reason
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: ""
      expectedStatusError: "should be at least 1 chars long"
    - name: Should not allow a controlPlaneTopologyTransitions entry with a reason exceeding max length
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: "Preflight012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789"
      expectedStatusError: "Too long: may not be more than 128 bytes"
    - name: Should not allow a controlPlaneTopologyTransitions entry with an empty message
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: PreflightCheckFailed
            message: ""
      expectedStatusError: "should be at least 1 chars long"
    - name: Should not allow a controlPlaneTopologyTransitions entry with a message exceeding max length
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: PreflightCheckFailed
            message: ""
      expectedStatusError: "Too long: may not be more than 2048 bytes"
    - name: Should not allow duplicate source/target pairs in controlPlaneTopologyTransitions
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          controlPlaneTopologyTransitions:
          - source: SingleReplica
            target: HighlyAvailable
            availability: Available
          - source: SingleReplica
            target: HighlyAvailable
            availability: Unavailable
            reason: PreflightCheckFailed
      expectedStatusError: "Duplicate value"

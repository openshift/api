              - name: openshift.io/test.cert-25
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-26
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-27

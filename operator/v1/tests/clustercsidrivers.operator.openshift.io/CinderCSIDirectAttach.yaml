      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          cinder:
            attachMode: Direct
    expectedError: 'driverType: Required value'
  - name: Should reject Cinder configuration on another resource
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: ebs.csi.aws.com
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
    expectedError: driverType Cinder requires metadata.name cinder.csi.openstack.org
  - name: Should reject AWS selection on the Cinder resource
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: AWS

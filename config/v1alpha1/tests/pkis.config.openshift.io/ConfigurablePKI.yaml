apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "PKI"
crdName: pkis.config.openshift.io
featureGates:
- ConfigurablePKI
tests:
  onCreate:
    - name: Should be able to create a PKI with only required defaults (RSA)
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 2048
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 2048
    - name: Should be able to create a PKI with ECDSA defaults and category overrides
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            caCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P384
            serverCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            clientCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            caCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P384
            serverCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            clientCertificates:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
    - name: Should reject a PKI without certificates
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec: {}
      expectedError: "spec.certificates: Required value"
    - name: Should reject certificates without defaults
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            caCertificates:
              key:
                algorithm: RSA
                rsa:
                  keySize: 4096
      expectedError: "spec.certificates.defaults: Required value"
    - name: Should reject an empty category override (MinProperties)
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 2048
            caCertificates: {}
      expectedError: "spec.certificates.caCertificates in body should have at least 1 properties"
    - name: Should reject RSA without the rsa field
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
      expectedError: "rsa is required when algorithm is RSA, and forbidden otherwise"
    - name: Should reject ECDSA with an rsa field
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
                rsa:
                  keySize: 2048
      expectedError: "rsa is required when algorithm is RSA, and forbidden otherwise"
    - name: Should accept RSA keySize 4096
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 4096
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 4096
    - name: Should reject RSA keySize 8192 (above the 4096 cap)
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 8192
      expectedError: "spec.certificates.defaults.key.rsa.keySize in body should be less than or equal to 4096"
    - name: Should reject RSA keySize that is not a multiple of 1024
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 3000
      expectedError: "spec.certificates.defaults.key.rsa.keySize in body should be a multiple of 1024"
    - name: Should reject an invalid ECDSA curve
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P224
      expectedError: "spec.certificates.defaults.key.ecdsa.curve: Unsupported value: \"P224\": supported values: \"P256\", \"P384\", \"P521\""
    - name: Should accept a named certificate override with a valid prefixed name
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/service-ca.service-serving-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 2048
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/service-ca.service-serving-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 2048
    - name: Should accept a named certificate override with only a name (no overrides)
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/etcd.signer
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/etcd.signer
    - name: Should reject a named certificate override with an unprefixed name
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: etcd.signer
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
      expectedError: "spec.certificates.namedCertificates[0].name: Invalid value: \"string\": name must be a prefixed qualified name, for example openshift.io/etcd.signer"
    - name: Should reject duplicate named certificate names
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/etcd.signer
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/etcd.signer
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P384
      expectedError: "Duplicate value"
    - name: Should accept keys with a named key
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys:
            namedKeys:
              - name: openshift.io/kube-apiserver.bound-service-account-token-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 4096
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys:
            namedKeys:
              - name: openshift.io/kube-apiserver.bound-service-account-token-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 4096
    - name: Should reject a named key without a key
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys:
            namedKeys:
              - name: openshift.io/kube-apiserver.bound-service-account-token-signer
      expectedError: "spec.keys.namedKeys[0].key: Required value"
    - name: Should reject duplicate named keys
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys:
            namedKeys:
              - name: openshift.io/kube-apiserver.bound-service-account-token-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 2048
              - name: openshift.io/kube-apiserver.bound-service-account-token-signer
                key:
                  algorithm: RSA
                  rsa:
                    keySize: 4096
      expectedError: "Duplicate value"
    - name: Should reject defaults with key omitted
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults: {}
      expectedError: "spec.certificates.defaults.key: Required value"
    - name: Should reject ECDSA algorithm without the ecdsa field
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
      expectedError: "ecdsa is required when algorithm is ECDSA, and forbidden otherwise"
    - name: Should reject RSA keySize 1024 (below the 2048 floor)
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 1024
      expectedError: "spec.certificates.defaults.key.rsa.keySize in body should be greater than or equal to 2048"
    - name: Should accept RSA keySize 3072
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 3072
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: RSA
                rsa:
                  keySize: 3072
    - name: Should accept ECDSA curve P521
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P521
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P521
    - name: Should reject more than 32 namedCertificates entries
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates:
              - name: openshift.io/test.cert-1
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-2
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-3
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-4
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-5
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-6
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-7
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-8
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-9
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-10
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-11
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-12
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-13
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-14
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-15
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-16
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
              - name: openshift.io/test.cert-17

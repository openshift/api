apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/2952
    api.openshift.io/filename-cvo-runlevel: "0000_10"
    api.openshift.io/filename-operator: etcd
    api.openshift.io/filename-ordering: "01"
    feature-gate.release.openshift.io/AutomatedEtcdBackup: "true"
  name: etcdbackups.operator.openshift.io
spec:
  group: operator.openshift.io
  names:
    kind: EtcdBackup
    listKind: EtcdBackupList
    plural: etcdbackups
    singular: etcdbackup
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Type of storage used for the backup
      jsonPath: .spec.storage.type
      name: Storage Type
      type: string
    - description: Status of the EtcdBackup
      jsonPath: .status.conditions[?(@.status=="True")].type
      name: Status
      type: string
    - description: Age of the EtcdBackup
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Name of the node where the backup was executed
      jsonPath: .status.nodeName
      name: Node
      priority: 1
      type: string
    - description: Name of the PVC where the backup is stored
      jsonPath: .spec.storage.pvc.name
      name: PVC
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          # EtcdBackup provides configuration options and status for a one-time backup attempt of the etcd cluster.
          # When an EtcdBackup is deleted the files created by it will be deleted as well, as long as the storage backend is still accessible.

          Compatibility level 4: No compatibility is provided, the API can change at any point for any reason. These capabilities should not be used by applications needing long term support.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds user settable values for configuration
            properties:
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  nodeSelector specifies which control plane nodes to select from for running the backup job. Only one backup job is run per EtcdBackup.
                  The default node-role.kubernetes.io/control-plane label will always be selected for in addition to any labels set here.
                  If no nodes are matched, then the backup will be marked failed.
                  For Local storage type, this may be used to target a specific node to take and store the backup.
                  For PVC storage type, this may be used to control where the backup is taken from.
                  When specified, nodeSelector must contain at least 1 entry and must not contain more than 10 entries.
                maxProperties: 10
                minProperties: 1
                type: object
              storage:
                description: storage specifies the location where etcd backup files
                  will be saved.
                properties:
                  local:
                    description: |-
                      local specifies a host path directory on the master node where the etcd backup file will be saved.
                      This field is required when storage type is "Local", and forbidden otherwise.
                    properties:
                      hostPath:
                        description: |-
                          hostPath is a local directory on the master node where the etcd backup file will be saved.
                          hostPath must be an absolute filepath between 1 and 2048 characters containing only alphanumeric characters, '/', '.', '_', or '-', starting with a '/'.
                        maxLength: 2048
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: hostPath must be a valid absolute filepath containing
                            only alphanumeric characters, '/', '.', '_', or '-', starting
                            with a '/'
                          rule: self.matches('^/[a-zA-Z0-9/._-]+$')
                    required:
                    - hostPath
                    type: object
                  pvc:
                    description: |-
                      pvc specifies the PersistentVolumeClaim (PVC) which binds a PersistentVolume where the etcd backup file will be saved.
                      The PVC must always be created in the "openshift-etcd" namespace.
                      This field is required when the storage type is "PVC", and forbidden otherwise.
                    properties:
                      name:
                        description: |-
                          name is a reference to a PVC in the "openshift-etcd" namespace where the etcd backup file will be saved.
                          name must be between 1 and 253 characters and conform to RFC 1123 subdomain format:
                          lowercase alphanumeric characters, '-' or '.', starting and ending with alphanumeric characters.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: name must be a lowercase RFC 1123 subdomain consisting
                            of lowercase alphanumeric characters, '-' or '.', and
                            must start and end with an alphanumeric character
                          rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                      path:
                        description: |-
                          path is a directory on the volume where the etcd backup file will be saved.
                          When present, path must be an absolute filepath between 1 and 2048 characters containing only alphanumeric characters, '/', '.', '_', or '-', starting with a '/'.
                        maxLength: 2048
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: path must be a valid absolute filepath containing
                            only alphanumeric characters, '/', '.', '_', or '-', starting
                            with a '/'
                          rule: self.matches('^/[a-zA-Z0-9/._-]+$')
                    required:
                    - name
                    type: object
                  type:
                    description: |-
                      type of storage backend to use for storing the etcd backup.
                      Allowed values are Local and PVC.
                      When set to Local, the backup will be saved to a host path directory on the control plane node it was taken on.
                      When set to PVC, the backup will be saved to a volume bound by a PersistentVolumeClaim.
                    enum:
                    - PVC
                    - Local
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: pvc is required when type is PVC, and forbidden otherwise
                  rule: 'self.type == ''PVC'' ? has(self.pvc) : !has(self.pvc)'
                - message: local is required when type is Local, and forbidden otherwise
                  rule: 'self.type == ''Local'' ? has(self.local) : !has(self.local)'
            required:
            - storage
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status holds observed values from the cluster. They may not
              be overridden.
            minProperties: 1
            properties:
              conditions:
                description: conditions provide details on the status of the etcd
                  backup job.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 10
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              files:
                description: |-
                  files tracks the path and size of files generated by the etcd backup.
                  Includes both etcd snapshots and static manifests.
                items:
                  properties:
                    path:
                      description: path to the backup file on the storage backend.
                      maxLength: 4096
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: path must be a valid absolute filepath
                        rule: self.matches('^/[a-zA-Z0-9/._-]+$')
                    sizeBytes:
                      description: |-
                        sizeBytes is the size of the backup file on the storage backend in bytes.
                        If omitted, then the file specified by path is an empty file.
                      format: int64
                      maximum: 9223372036854776000
                      minimum: 1
                      type: integer
                  required:
                  - path
                  type: object
                maxItems: 10
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              jobName:
                description: |-
                  jobName is a reference to the Job created for the backup. It always runs in the openshift-etcd namespace.
                  jobName must be between 1 and 253 characters and conform to RFC 1123 subdomain format:
                  lowercase alphanumeric characters, '-' or '.', starting and ending with alphanumeric characters.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: jobName must be a lowercase RFC 1123 subdomain consisting
                    of lowercase alphanumeric characters, '-' or '.', and must start
                    and end with an alphanumeric character
                  rule: '!format.dns1123Subdomain().validate(self).hasValue()'
              nodeName:
                description: |-
                  nodeName is used for Local backups to bind the control plane node where the snapshot will be taken.
                  nodeName must be between 1 and 63 characters and conform to RFC 1123 subdomain format:
                  lowercase alphanumeric characters, '-' or '.', starting and ending with alphanumeric characters.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodeName must be a lowercase RFC 1123 subdomain consisting
                    of lowercase alphanumeric characters, '-' or '.', and must start
                    and end with an alphanumeric character
                  rule: '!format.dns1123Subdomain().validate(self).hasValue()'
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

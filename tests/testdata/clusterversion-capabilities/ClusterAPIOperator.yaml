      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.14 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.14
            additionalEnabledCapabilities:
            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.14
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.15 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.15
      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.15 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:

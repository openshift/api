            - name: example.com/device0
              limit: '1'
            - name: example.com/device1
              limit: '1'
            - name: example.com/device2
              limit: '1'
            - name: example.com/device3
              limit: '1'
            - name: example.com/device4
              limit: '1'
            - name: example.com/device5
              limit: '1'
            - name: example.com/device6
              limit: '1'
            - name: example.com/device7
              limit: '1'
  - name: Should not allow an empty router list
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router: []
    expectedError: should have at least 1 items
  - name: Should not allow resources above the maximum
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: example.com/device0
              limit: '1'
            - name: example.com/device1
              limit: '1'
            - name: example.com/device2
              limit: '1'
            - name: example.com/device3
              limit: '1'
            - name: example.com/device4
              limit: '1'
            - name: example.com/device5
              limit: '1'
            - name: example.com/device6
              limit: '1'
            - name: example.com/device7
              limit: '1'
            - name: example.com/device8
              limit: '1'
    expectedError: must have at most 8 items
  - name: Should not allow duplicate resource names
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
              limit: '1'
            - name: cpu
              limit: '2'
    expectedError: Duplicate value
  - name: Should not allow a resource entry without a request or limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
    expectedError: at least one of request or limit
  - name: Should not allow a resource entry without a name
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - limit: '1'
    expectedError: 'name: Required value'
  - name: Should not allow an invalid qualified resource name
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: example.com/bad+name
              limit: '1'
    expectedError: valid Kubernetes qualified name
  - name: Should not allow a qualified name component over 63 characters
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              limit: '1'
    expectedError: valid Kubernetes qualified name
  - name: Should not allow an unsupported native resource
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: storage
              limit: 1Gi
    expectedError: name must be cpu
  - name: Should not allow the reserved kubernetes.io domain
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: kubernetes.io/device

    expectedError: reserved kubernetes.io domain
  - name: Should not allow a kubernetes.io subdomain
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: node.kubernetes.io/device
              limit: '1'
    expectedError: reserved kubernetes.io domain
  - name: Should not allow a 'requests.' prefix
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: requests.example.com/device
              limit: '1'
    expectedError: must not start with 'requests.'
  - name: Should not allow a request greater than the limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
              request: '2'
              limit: '1'
    expectedError: limit must be greater than or equal to request
  - name: Should not allow a precise request greater than the limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: memory
              request: '9007199254740993'
              limit: '9007199254740992'
    expectedError: limit must be greater than or equal to request
  - name: Should not allow an extended resource request without a limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: example.com/device
              request: '1'
    expectedError: requests require a limit
  - name: Should not allow an unequal extended resource request and limit
    initial: |
      apiVersion: operator.openshift.io/v1

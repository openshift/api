apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "ControllerManager"
crdName: controllermanagers.config.openshift.io
featureGates:
  - DisableForceDetachOnTimeout
tests:
  onCreate:
    - name: Should be able to create with force detach disabled
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Disabled
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Disabled
    - name: Should reject a ControllerManager not named cluster
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: foo
        spec:
          forceDetachOnTimeout: Disabled
      expectedError: "Invalid value: \"object\": controllermanager is a singleton, .metadata.name must be 'cluster'"
    - name: Should reject unsupported value of forceDetachOnTimeout
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: INVALID
      expectedError: "spec.forceDetachOnTimeout: Unsupported value: \"INVALID\": supported values: \"Enabled\", \"Disabled\""
    - name: Should reject an empty spec
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec: {}
      expectedError: "spec: Invalid value: 0: spec in body should have at least 1 properties"
  onUpdate:
    - name: Enabled to Disabled
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Disabled
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Disabled
    - name: Should be able to set a Progressing condition
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
        status:
          conditions:
          - type: Progressing
            status: "True"
            reason: RolloutInProgress
            message: rolling out to kube-controller-manager
            lastTransitionTime: "2024-01-01T00:00:00Z"
      expected: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
        status:
          conditions:
          - type: Progressing
            status: "True"
            reason: RolloutInProgress
            message: rolling out to kube-controller-manager
            lastTransitionTime: "2024-01-01T00:00:00Z"
    - name: Should reject an empty conditions list
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
      updated: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec:
          forceDetachOnTimeout: Enabled
        status:
          conditions: []
      expectedStatusError: "status.conditions: Invalid value: 0: conditions in body should have at least 1 items"

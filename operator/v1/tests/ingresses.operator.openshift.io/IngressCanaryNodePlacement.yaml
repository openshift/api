apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Ingress"
crdName: ingresses.operator.openshift.io
version: v1
featureGates:
- IngressCanaryNodePlacement
tests:
  onCreate:
  - name: Should be able to create an Ingress with canary nodePlacement tolerations
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoSchedule
  - name: Should not be able to create an Ingress with a wildcard toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - operator: Exists
              effect: NoSchedule
    expectedError: spec.canary.nodePlacement.tolerations[0].key
  - name: Should be able to create an Ingress with tolerationSeconds on a NoExecute toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 60
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 60
  - name: Should be able to create an Ingress with duplicate tolerations
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              effect: NoSchedule
              value: value-1
            - key: example.com/taint
              operator: Equal
              effect: NoSchedule
              value: value-1
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              effect: NoSchedule
              value: value-1
            - key: example.com/taint
              operator: Equal
              effect: NoSchedule
              value: value-1
  - name: Should be able to create an Ingress with both canary and gatewayAPI configuration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              effect: NoSchedule
  - name: Should not be able to create an Ingress with an unknown toleration operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Matches
              effect: NoSchedule
              value: value-1
    expectedError: spec.canary.nodePlacement.tolerations[0].operator
  - name: Should not be able to create an Ingress with an unknown toleration effect
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoOp
    expectedError: spec.canary.nodePlacement.tolerations[0].effect
  - name: Should not be able to create an Ingress with a value on an Exists toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              effect: NoSchedule
              value: value-1
    expectedError: tolerations value must be empty when operator is 'Exists'
  - name: Should not be able to create an Ingress with an empty toleration key
    initial: |
      apiVersion: operator.openshift.io/v1

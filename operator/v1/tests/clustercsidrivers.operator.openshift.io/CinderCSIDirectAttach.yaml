apiVersion: apiextensions.k8s.io/v1
name: ClusterCSIDriver Cinder attachment
crdName: clustercsidrivers.operator.openshift.io
featureGates:
- CinderCSIDirectAttach
tests:
  onCreate:
  - name: Should preserve omitted Cinder configuration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec: {}
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow an empty legacy driver discriminator on Cinder
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: ''
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: ''
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow explicit Nova attachment
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Nova
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Nova
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow empty backend configuration in Nova mode
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Nova
            backendConfig: []
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Nova
            backendConfig: []
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow explicit Direct attachment
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow empty backend configuration in Direct mode
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
            backendConfig: []
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
            backendConfig: []
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow backend Secret files in Direct mode
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
            backendConfig:
            - name: ceph-files
              secret:
                name: ceph-backend-config
              mountPath: /etc/ceph
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver

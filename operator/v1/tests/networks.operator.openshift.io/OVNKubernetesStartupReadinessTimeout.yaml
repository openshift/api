apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Network"
crdName: networks.operator.openshift.io
featureGates:
- OVNKubernetesStartupReadinessTimeout
tests:
  onCreate:
  - name: Should be able to create Network without startupReadinessTimeoutSeconds
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig: {}
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            ipsecConfig:
              mode: Disabled
  - name: Should be able to set startupReadinessTimeoutSeconds to 600
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 600
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 600
            ipsecConfig:
              mode: Disabled
  - name: Should be able to set startupReadinessTimeoutSeconds to the minimum of 1
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 1
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 1
            ipsecConfig:
              mode: Disabled
  - name: Should be able to set startupReadinessTimeoutSeconds to the maximum of 3600
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 3600
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 3600
            ipsecConfig:
              mode: Disabled
  - name: Should not allow startupReadinessTimeoutSeconds below 1
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: -1
    expectedError: "spec.defaultNetwork.ovnKubernetesConfig.startupReadinessTimeoutSeconds: Invalid value: -1: spec.defaultNetwork.ovnKubernetesConfig.startupReadinessTimeoutSeconds in body should be greater than or equal to 1"
  - name: Should not allow startupReadinessTimeoutSeconds above 3600
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 3601
    expectedError: "spec.defaultNetwork.ovnKubernetesConfig.startupReadinessTimeoutSeconds: Invalid value: 3601: spec.defaultNetwork.ovnKubernetesConfig.startupReadinessTimeoutSeconds in body should be less than or equal to 3600"
  onUpdate:
  - name: Should be able to change startupReadinessTimeoutSeconds on day 2
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 600
    updated: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 900
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 900
            ipsecConfig:
              mode: Disabled
  - name: Should be able to remove startupReadinessTimeoutSeconds
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            startupReadinessTimeoutSeconds: 600
    updated: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        defaultNetwork:
          ovnKubernetesConfig: {}
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Network
      spec:
        disableNetworkDiagnostics: false
        logLevel: Normal
        operatorLogLevel: Normal
        defaultNetwork:
          ovnKubernetesConfig:
            ipsecConfig:
              mode: Disabled

apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- MutableTopology
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure without controlPlaneTopology in spec
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: External
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "External": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to DualReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: DualReplica
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "DualReplica": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to HighlyAvailableArbiter
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailableArbiter
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "HighlyAvailableArbiter": supported values: "HighlyAvailable", "SingleReplica"'
  onUpdate:
    - name: Should allow updating spec controlPlaneTopology from SingleReplica to HighlyAvailable when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when it was not previously set and status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow removing spec controlPlaneTopology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow keeping spec controlPlaneTopology unchanged
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow updating spec controlPlaneTopology to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should allow updating Infrastructure status without topologyTransitionStatus
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow empty transition status before evaluation
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions: []
            conditions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions: []
            conditions: []
    - name: Should allow reporting a transition in progress with failing evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
            conditions:
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying topology changes
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
            conditions:
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying topology changes
    - name: Should reject an unsupported topology transition condition status
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionCompleted
              status: InProgress
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying topology changes
      expectedStatusError: 'status.topologyTransitionStatus.conditions[0].status: Unsupported value: "InProgress": supported values: "True", "False", "Unknown"'
    - name: Should reject an unsupported top-level condition type
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionAvailable
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: PreflightCheckFailed
              message: A preflight check failed
      expectedStatusError: "conditions may only contain TopologyTransitionsEvaluated and TopologyTransitionCompleted"
    - name: Should allow stale transition evaluations until the evaluation condition is reported
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
    - name: Should enforce the maximum transition count
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expectedStatusError: "Too many: 2: must have at most 1 items"
    - name: Should allow omitting transitions when topologyTransitionStatus is set
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            conditions: []
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions: []
    - name: Should require a target on transitions
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:

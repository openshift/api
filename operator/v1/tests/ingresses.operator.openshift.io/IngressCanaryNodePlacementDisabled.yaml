apiVersion: apiextensions.k8s.io/v1
name: Ingress canary schema absent
crdName: ingresses.operator.openshift.io
version: v1
featureGates:
- GatewayAPIManagementMode
- -IngressCanaryNodePlacement
tests:
  onCreate:
  - name: Should prune canary when its feature gate is disabled
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
  onUpdate:
  - name: Should prune canary on update when its feature gate is disabled
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
    updated: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed

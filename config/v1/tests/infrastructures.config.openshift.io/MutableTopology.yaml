                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: The transition is unavailable
      expectedStatusError: "status.topologyTransitionStatus.transitions[0].target: Required value"
    - name: Should require a source on transitions
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: The transition is unavailable
      expectedStatusError: "status.topologyTransitionStatus.transitions[0].source: Required value"
    - name: Should require an availability condition among transition evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
      expectedStatusError: "evaluations must contain TopologyTransitionAvailable"
    - name: Should require evaluations on a transition
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
      expectedStatusError: "status.topologyTransitionStatus.transitions[0].evaluations: Required value"
    - name: Should allow evaluation and completion conditions with an available transition
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: TransitionComplete
              message: Transition completed
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: TransitionComplete
              message: Transition completed
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
    - name: Should allow updating a transition from unavailable to available
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PreflightCheckFailed
                message: The transition is unavailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available

apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "ControllerManager"
crdName: controllermanagers.config.openshift.io
featureGates:
  - ControllerManagerConfig
tests:
  onCreate:
    - name: Should reject a ControllerManager not named cluster
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: foo
        spec:
          forceDetachOnTimeout: Enabled
      expectedError: "Invalid value: \"object\": controllermanager is a singleton, .metadata.name must be 'cluster'"
    - name: Should reject an empty spec
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: ControllerManager
        metadata:
          name: cluster
        spec: {}
      expectedError: "spec: Invalid value: 0: spec in body should have at least 1 properties"

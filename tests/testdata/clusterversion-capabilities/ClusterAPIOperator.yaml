apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "ClusterVersion"
crdName: clusterversions.config.openshift.io
featureGates:
  - ClusterAPIOperator
  - "-CRDCompatibilityRequirementOperator"
tests:
  onCreate:
    - name: v4.11 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.11
      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.11 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.11
            additionalEnabledCapabilities:
            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.11
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.12 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.12
      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.12 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.12
            additionalEnabledCapabilities:
            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.12
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.13 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.13
      expectedError: the MachineAPI capability requires the ClusterAPI capability
    - name: v4.13 accepts additional ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.13
            additionalEnabledCapabilities:
            - ClusterAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.13
            additionalEnabledCapabilities:
            - ClusterAPI
    - name: v4.14 rejects MachineAPI without ClusterAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:

apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- MutableTopology
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure without controlPlaneTopology in spec
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: External
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "External": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to DualReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: DualReplica
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "DualReplica": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should not allow creating Infrastructure with spec controlPlaneTopology set to HighlyAvailableArbiter
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailableArbiter
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "HighlyAvailableArbiter": supported values: "HighlyAvailable", "SingleReplica"'
  onUpdate:
    - name: Should allow updating spec controlPlaneTopology from SingleReplica to HighlyAvailable when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when it was not previously set and status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow removing spec controlPlaneTopology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow keeping spec controlPlaneTopology unchanged
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow updating spec controlPlaneTopology to an invalid value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: InvalidValue
      expectedError: 'spec.controlPlaneTopology: Unsupported value: "InvalidValue": supported values: "HighlyAvailable", "SingleReplica"'
    - name: Should allow updating Infrastructure status without topologyTransitionStatus
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow an empty availableTransitions list after successful evaluation
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions: []
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: No transitions are available
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
          topologyTransitionStatus:
            availableTransitions: []
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: No transitions are available
    - name: Should allow reporting current transition progress
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              reason: PreflightCheckFailed
            currentTransition:
              status: Partial
              reason: TransitionInProgress
              message: Applying topology changes
              startedTime: "2025-01-01T00:00:00Z"
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            availableTransitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              reason: PreflightCheckFailed
            currentTransition:
              status: Partial
              reason: TransitionInProgress
              message: Applying topology changes
              startedTime: "2025-01-01T00:00:00Z"
    - name: Should reject a topology transition reason that is not CamelCase
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              reason: preflightCheckFailed
      expectedStatusError: "reason must be CamelCase, matching ^[A-Z][A-Za-z0-9]*$"
    - name: Should reject an available transition whose source does not match status topology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions:
            - source:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              target:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
      expectedStatusError: "transition sources must match the current status topology"
    - name: Should enforce the supported maximum available transition count
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
      expectedStatusError: "Too many: 2: must have at most 1 items"
    - name: Should require availableTransitions when topologyTransitionStatus is set
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            conditions: []
      expectedStatusError: "Required value"
    - name: Should require status on currentTransition
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          topologyTransitionStatus:
            availableTransitions: []
            currentTransition:
              reason: TransitionInProgress
              message: Applying topology changes
      expectedStatusError: "Required value"

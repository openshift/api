apiVersion: apiextensions.k8s.io/v1
name: IngressController
crdName: ingresscontrollers.operator.openshift.io
featureGates:
- IngressControllerResourceConfiguration
tests:
  onCreate:
  - name: Should be able to set router request and limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
              request: 100m
              limit: 500m
            - name: memory
              request: 128Mi
              limit: 256Mi
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        httpEmptyRequestsPolicy: Respond
        idleConnectionTerminationPolicy: Immediate
        closedClientConnectionPolicy: Continue
        resources:
          router:
            - name: cpu
              request: 100m
              limit: 500m
            - name: memory
              request: 128Mi
              limit: 256Mi
  - name: Should be able to set haproxy request and limit
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          haproxy:
            - name: cpu
              request: 100m
              limit: 500m
            - name: memory
              request: 128Mi
              limit: 256Mi
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        httpEmptyRequestsPolicy: Respond
        idleConnectionTerminationPolicy: Immediate
        closedClientConnectionPolicy: Continue
        resources:
          haproxy:
            - name: cpu
              request: 100m
              limit: 500m
            - name: memory
              request: 128Mi
              limit: 256Mi
  - name: Should be able to set only a router request
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
              request: 100m
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        httpEmptyRequestsPolicy: Respond
        idleConnectionTerminationPolicy: Immediate
        closedClientConnectionPolicy: Continue
        resources:
          router:
            - name: cpu
              request: 100m
  - name: Should not default the API request for a router limit only
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:
            - name: cpu
              limit: '4'
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        httpEmptyRequestsPolicy: Respond
        idleConnectionTerminationPolicy: Immediate
        closedClientConnectionPolicy: Continue
        resources:
          router:
            - name: cpu
              limit: '4'
  - name: Should be able to set integer JSON quantities
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        resources:
          router:

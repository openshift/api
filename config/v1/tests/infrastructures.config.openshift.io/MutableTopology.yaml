apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- MutableTopology
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure without controlPlaneTopology in spec
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
    - name: Should be able to create Infrastructure with spec controlPlaneTopology set to SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
  onUpdate:
    # Request admission uses the persisted topology, not transition availability.
    - name: Should allow updating spec controlPlaneTopology from SingleReplica to HighlyAvailable when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when it was not previously set and status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to HighlyAvailable when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: HighlyAvailable
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is SingleReplica
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology to SingleReplica when status controlPlaneTopology is HighlyAvailable
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: HighlyAvailable
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: HighlyAvailable
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow cancelling a requested transition by matching spec and status control plane topologies
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: SingleReplica
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: HighlyAvailable
          cpuPartitioning: None
    - name: Should not allow setting spec controlPlaneTopology when status controlPlaneTopology is External
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: External
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: External
      expectedError: "spec.controlPlaneTopology must match status.controlPlaneTopology or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica"
    - name: Should allow updating a transition from unavailable to available
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotRequested
              message: No transition has been requested
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: PrerequisiteMissing
                message: Additional control-plane nodes are not ready
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
      updated: &evaluated_available_choices |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-02T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotRequested
              message: No transition has been requested
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "True"
                lastTransitionTime: "2025-01-03T00:00:00Z"
                reason: PrerequisitesMet
                message: All prerequisites are met
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-03T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
      expected: *evaluated_available_choices
    - name: Should report a requested transition in progress even when preflight checks no longer pass
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisitesMet
                message: All prerequisites are met
              - type: TopologyTransitionAvailable
                status: "True"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: EvaluationComplete
                message: The transition is available
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying the requested topology
      updated: &progress_with_failed_reevaluation |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          controlPlaneTopology: HighlyAvailable
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite no longer holds
              - type: TopologyTransitionAvailable
                status: "False"
                lastTransitionTime: "2025-01-02T00:00:00Z"
                reason: PreflightCheckFailed
                message: A preflight check failed
            conditions:
            - type: TopologyTransitionsEvaluated
              status: "True"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: EvaluationComplete
              message: Transition checks finished
            - type: TopologyTransitionCompleted
              status: "False"
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: TransitionInProgress
              message: Applying the requested topology despite changed preflight results
      expected: *progress_with_failed_reevaluation
    - name: Should reject a transition choice with an external control plane topology
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: External
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: External
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
          topologyTransitionStatus:
            conditions:
            - type: TopologyTransitionsEvaluated
              status: Unknown
              lastTransitionTime: "2025-01-01T00:00:00Z"
              reason: NotEvaluated
              message: This hypothetical transition has not been evaluated
            transitions:
            - source:
                controlPlaneTopology: External
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: External
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: TopologyTransitionAvailable
                status: Unknown
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: NotEvaluated
                message: Availability of this hypothetical transition is unknown
      expectedStatusError: 'status.topologyTransitionStatus.transitions[0].source.controlPlaneTopology: Unsupported value: "External"'
    - name: Should require an availability condition among transition evaluations
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          cpuPartitioning: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
        status:
          controlPlaneTopology: SingleReplica
          infrastructureTopology: SingleReplica
          topologyTransitionStatus:
            transitions:
            - source:
                controlPlaneTopology: SingleReplica
                infrastructureTopology: SingleReplica
              target:
                controlPlaneTopology: HighlyAvailable
                infrastructureTopology: HighlyAvailable
              evaluations:
              - type: PreflightCheckPassed
                status: "False"
                lastTransitionTime: "2025-01-01T00:00:00Z"
                reason: PrerequisiteMissing
                message: A prerequisite is missing
      expectedStatusError: "evaluations must contain TopologyTransitionAvailable"

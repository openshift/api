apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "ClusterVersion"
crdName: clusterversions.config.openshift.io
featureGates:
  - "-ClusterAPIOperator"
tests:
  onCreate:
    - name: Should be able to create a ClusterVersion with base capability None, and additional capabilities baremetal and MachineAPI
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: None
            additionalEnabledCapabilities:
            - baremetal
            - MachineAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: None
            additionalEnabledCapabilities:
            - baremetal
            - MachineAPI
    - name: MachineAPI does not require ClusterAPI when the operator gate is disabled
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.11
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: v4.11
  onUpdate:
    - name: Should be able to add the baremetal capability with a ClusterVersion with base capability None, with the Machine API capability
      initial: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: None
      updated: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: None
            additionalEnabledCapabilities:
            - baremetal
            - MachineAPI
      expected: |
        apiVersion: config.openshift.io/v1
        kind: ClusterVersion
        spec:
          clusterID: foo
          capabilities:
            baselineCapabilitySet: None
            additionalEnabledCapabilities:
            - baremetal
            - MachineAPI

apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "MachineConfiguration"
crdName: machineconfigurations.operator.openshift.io
featureGates:
- ManagedBootImagesAWSCAPI
tests:
  onCreate:
    - name: Should be able to create a minimal MachineConfiguration
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec: {} # No spec is required for a MachineConfiguration
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
    - name: Should be able to create a ManagedBootImages configuration knob that opts in all CAPI MachineSets
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
    - name: Should be able to create a ManagedBootImages configuration knob that opts in CAPI MachineSets in partial mode
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: Partial
                  partial:
                    machineResourceSelector:
                      matchLabels: {}
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: Partial
                  partial:
                    machineResourceSelector:
                      matchLabels: {}
    - name: Should be able to create a ManagedBootImages configuration knob that opts in all CAPI MachineDeployments
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
    - name: Should be able to create a ManagedBootImages configuration knob that opts in CAPI MachineDeployments in partial mode
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: Partial
                  partial:
                    machineResourceSelector:
                      matchLabels: {}
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: Partial
                  partial:
                    machineResourceSelector:
                      matchLabels: {}
    - name: Should be able to mix MAPI MachineSets and CAPI MachineSets in machineManagers
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
    - name: Should be able to mix CAPI MachineSets and CAPI MachineDeployments in machineManagers
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
    - name: Should not permit machinedeployments with machine.openshift.io API group
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinedeployments
                apiGroup: machine.openshift.io
                selection:
                  mode: All
      expectedError: "the machinedeployments resource is only supported in the cluster.x-k8s.io API group"
    - name: Only one unique pair of resource/apiGroup is allowed in machineManagers
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: None
      expectedError: "spec.managedBootImages.machineManagers[1]: Duplicate value: map[string]interface {}{\"apiGroup\":\"cluster.x-k8s.io\", \"resource\":\"machinesets\"}"
  onUpdate:
    - name: Should permit an "All" CAPI MachineSet boot image configuration when bootImageSkewEnforcementStatus.mode is Automatic
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec: {}
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      updated: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      expected: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          logLevel: Normal
          operatorLogLevel: Normal
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
    - name: Should not permit a "None" CAPI MachineSet boot image configuration when bootImageSkewEnforcementStatus.mode is Automatic
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec: {}
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      updated: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec:
          managedBootImages:
            machineManagers:
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: None
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      expectedError: "when skew enforcement is in Automatic mode, any CAPI MachineSet MachineManager must use selection mode 'All'"
    - name: Should require managedBootImagesStatus to contain a CAPI MachineSet MachineManager with All mode when bootImageSkewEnforcementStatus.mode is Automatic
      initial: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec: {}
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      updated: |
        apiVersion: operator.openshift.io/v1
        kind: MachineConfiguration
        spec: {}
        status:
          managedBootImagesStatus:
            machineManagers:
              - resource: machinesets
                apiGroup: machine.openshift.io
                selection:
                  mode: All
              - resource: machinesets
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: None
              - resource: machinedeployments
                apiGroup: cluster.x-k8s.io
                selection:
                  mode: All
          bootImageSkewEnforcementStatus:
            mode: Automatic
            automatic:
              ocpVersion: "4.18.2"
              rhcosVersion: "416.94.202411201433-0"
      expectedStatusError: "when skew enforcement is in Automatic mode, managedBootImagesStatus must contain a MachineManager opting in all CAPI MachineSets"
    - name: Should require managedBootImagesStatus to contain a CAPI MachineSet MachineManager when bootImageSkewEnforcementStatus.mode is Automatic
      initial: |

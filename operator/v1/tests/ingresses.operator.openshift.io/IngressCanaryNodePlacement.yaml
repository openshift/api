    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
    updated: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:

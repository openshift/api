              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
            - key: example.com/taint
              operator: Exists
    expectedError: "must have at most 32 items"
  - name: Should not be able to create an Ingress with an empty tolerations list
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations: []
    expectedError: "should have at least 1 items"
  - name: Should not be able to create an Ingress with an empty canary
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary: {}
    expectedError: "spec.canary in body should have at least 1 properties"
  - name: Should not be able to create an Ingress with an empty canary nodePlacement
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement: {}
    expectedError: "spec.canary.nodePlacement in body should have at least 1 properties"
  - name: Should be able to create an Ingress with a toleration that omits operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              value: value-1
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              value: value-1
  - name: Should be able to create an Ingress with a toleration with an empty operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: ""
              value: value-1
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: ""
              value: value-1
  - name: Should be able to create an Ingress with a toleration with an empty effect
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: ""
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: ""
  - name: Should be able to create an Ingress with an Exists toleration with an empty value
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              value: ""
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              value: ""
  - name: Should be able to create an Ingress with a PreferNoSchedule toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: PreferNoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: PreferNoSchedule
  - name: Should be able to create an Ingress with exactly 32 tolerations
    initial: |
      apiVersion: operator.openshift.io/v1

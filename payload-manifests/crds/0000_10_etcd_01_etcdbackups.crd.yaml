apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/2952
    api.openshift.io/merged-by-featuregates: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-set: CustomNoUpgrade,DevPreviewNoUpgrade,TechPreviewNoUpgrade
  name: etcdbackups.operator.openshift.io
spec:
  group: operator.openshift.io
  names:
    kind: EtcdBackup
    listKind: EtcdBackupList
    plural: etcdbackups
    singular: etcdbackup
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Type of storage used for the backup
      jsonPath: .spec.storage.type
      name: Storage Type
      type: string
    - description: Status of the EtcdBackup
      jsonPath: .status.conditions[?(@.status=="True")].type
      name: Status
      type: string
    - description: Age of the EtcdBackup
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Name of the node where the backup was executed
      jsonPath: .status.nodeName
      name: Node
      priority: 1
      type: string
    - description: Name of the PVC where the backup is stored
      jsonPath: .spec.storage.pvc.name
      name: PVC
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          # EtcdBackup provides configuration options and status for a one-time backup attempt of the etcd cluster

          Compatibility level 4: No compatibility is provided, the API can change at any point for any reason. These capabilities should not be used by applications needing long term support.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds user settable values for configuration
            properties:
              nodeName:
                description: |-
                  nodeName specifies the master node where an etcd backup should be taken.
                  If not specified, a random master node will be selected.
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable once set
                  rule: self == oldSelf
              storage:
                description: storage specifies the location where etcd backup files
                  will be saved.
                properties:
                  local:
                    description: |-
                      local specifies a host path directory on the master node where the etcd backup file will be saved.
                      This field is required when storage type is "Local"
                    properties:
                      hostPath:
                        description: hostPath is a local directory on the master node
                          where the etcd backup file will be saved.
                        type: string
                        x-kubernetes-validations:
                        - message: hostPath is immutable once set
                          rule: self == oldSelf
                    required:
                    - hostPath
                    type: object
                  pvc:
                    description: |-
                      pvc specifies the PersistentVolumeClaim (PVC) which binds a PersistentVolume where the etcd backup file will be saved.
                      The PVC must always be created in the "openshift-etcd" namespace.
                      This field is required when the storage type is "PVC"
                    properties:
                      name:
                        description: name is a reference to a PVC in the "openshift-etcd"
                          namespace where the etcd backup file will be saved.
                        type: string
                        x-kubernetes-validations:
                        - message: name is immutable once set
                          rule: self == oldSelf
                      path:
                        description: path is a directory on the volume where the etcd
                          backup file will be saved.
                        type: string
                        x-kubernetes-validations:
                        - message: path is immutable once set
                          rule: self == oldSelf
                    required:
                    - name
                    type: object
                  type:
                    description: EtcdBackupStorageType is an enum of the supported
                      storage backends for backup files
                    enum:
                    - PVC
                    - Local
                    type: string
                    x-kubernetes-validations:
                    - message: type is immutable once set
                      rule: self == oldSelf
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: pvc is required when type is PVC, and forbidden otherwise
                  rule: 'self.type == ''PVC'' ? has(self.pvc) : !has(self.pvc)'
                - message: local is required when type is Local, and forbidden otherwise
                  rule: 'self.type == ''Local'' ? has(self.local) : !has(self.local)'
            required:
            - storage
            type: object
          status:
            description: status holds observed values from the cluster. They may not
              be overridden.
            properties:
              conditions:
                description: conditions provide details on the status of the etcd
                  backup job.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              files:
                description: |-
                  files tracks the path and size of files generated by the etcd backup.
                  Includes both etcd snapshots and static manifests.
                items:
                  properties:
                    path:
                      description: path to the backup file on the storage backend.
                      type: string
                    size:
                      anyOf:
                      - type: integer
                      - type: string
                      description: size of the backup file on the storage backend.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                  type: object
                type: array
              job:
                description: job is a reference to the Job created for the backup.
                properties:
                  name:
                    description: name of the backup job
                    type: string
                  namespace:
                    description: namespace of the backup job
                    type: string
                  uid:
                    description: uid of the backup job
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              nodeName:
                description: nodeName is the master node where the backup snapshot
                  was taken.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "EtcdBackup"
crdName: etcdbackups.operator.openshift.io
featureGates:
- AutomatedEtcdBackup
tests:
  onCreate:
    - name: Should be able to create an EtcdBackup with local storage
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: Local
            local:
              hostPath: /etc/etcd/backups
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: Local
            local:
              hostPath: /etc/etcd/backups
    - name: Should be able to create an EtcdBackup with pvc storage
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: PVC
            pvc:
              name: etcdbackup-pvc
              path: /etcdbackups
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: PVC
            pvc:
              name: etcdbackup-pvc
              path: /etcdbackups
  onUpdate:
    - name: etcdbackup is immutable once created
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: PVC
            pvc:
              name: etcdbackup-pvc
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: EtcdBackup
        spec:
          storage:
            type: PVC
            pvc:
              name: etcdbackup-pvc
              path: /etcdbackups
      expectedError: "spec: Invalid value: \"object\": spec is immutable"

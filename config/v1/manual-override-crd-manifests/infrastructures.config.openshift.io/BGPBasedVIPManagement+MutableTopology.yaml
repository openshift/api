apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    feature-gate.release.openshift.io/BGPBasedVIPManagement: "true"
    feature-gate.release.openshift.io/MutableTopology: "true"
  name: infrastructures.config.openshift.io
spec:
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              controlPlaneTopology:
                type: string
            type: object
          status:
            properties:
              controlPlaneTopology:
                type: string
              platformStatus:
                properties:
                  baremetal:
                    properties:
                      vipManagement:
                        type: string
                    type: object
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: status.platformStatus.baremetal.vipManagement may not be removed
            once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.platformStatus) || !has(oldSelf.status.platformStatus.baremetal)
            || !has(oldSelf.status.platformStatus.baremetal.vipManagement) || (has(self.status)
            && has(self.status.platformStatus) && has(self.status.platformStatus.baremetal)
            && has(self.status.platformStatus.baremetal.vipManagement))'
        - message: spec.controlPlaneTopology must match status.controlPlaneTopology
            or be set to HighlyAvailable when status.controlPlaneTopology is SingleReplica
          rule: '!has(self.spec.controlPlaneTopology) || (has(oldSelf.spec.controlPlaneTopology)
            && self.spec.controlPlaneTopology == oldSelf.spec.controlPlaneTopology)
            || (has(self.status.controlPlaneTopology) && self.spec.controlPlaneTopology
            == self.status.controlPlaneTopology) || (has(self.status.controlPlaneTopology)
            && self.status.controlPlaneTopology == ''SingleReplica'' && self.spec.controlPlaneTopology
            == ''HighlyAvailable'')'
    subresources:
      status: {}

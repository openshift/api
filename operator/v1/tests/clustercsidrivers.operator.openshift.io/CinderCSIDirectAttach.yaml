        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
            backendConfig:
            - name: ceph-files
              secret:
                name: ceph-backend-config
              mountPath: /etc/ceph
        logLevel: Normal
        operatorLogLevel: Normal
  - name: Should allow multiple sources at the same destination
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: cinder.csi.openstack.org
      spec:
        driverConfig:
          driverType: Cinder
          cinder:
            attachMode: Direct
            backendConfig:
            - name: ceph-files
              secret:
                name: ceph-backend-config
              mountPath: /etc/ceph
            - name: extra-files
              secret:
                name: extra-backend-config
              mountPath: /etc/ceph
    expected: |

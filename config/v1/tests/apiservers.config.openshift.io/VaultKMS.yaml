apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "APIServer Vault KMS Plugin Validation"
crdName: apiservers.config.openshift.io
featureGates:
- KMSEncryption
tests:
  onCreate:
    - name: Should be able to create with valid Vault KMS pluginConfig reference
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: vaultkmsconfigs
                name: my-vault-kms
      expected: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          audit:
            profile: Default
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: vaultkmsconfigs
                name: my-vault-kms

    - name: Should reject Vault KMS config without pluginConfig
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
      expectedError: "pluginConfig"

    - name: Should be able to create with arbitrary provider pluginConfig reference GVR
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: example.com/v1
                resource: examplekmsconfigs
                name: my-kms-config
      expected: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          audit:
            profile: Default
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: example.com/v1
                resource: examplekmsconfigs
                name: my-kms-config

    - name: Should reject invalid pluginConfig apiVersion format
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: not-a-valid-api-version
                resource: vaultkmsconfigs
                name: my-vault-kms
      expectedError: "apiVersion must be in the format <group>/<version>"

    - name: Should reject invalid pluginConfig resource format
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: VaultKMSConfig
                name: my-vault-kms
      expectedError: "resource must be a valid Kubernetes resource name"

    - name: Should reject invalid pluginConfig name
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: vaultkmsconfigs
                name: invalid_name!
      expectedError: "name must be a valid DNS subdomain name"

    - name: Should reject pluginConfig with empty apiVersion
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: ""
                resource: vaultkmsconfigs
                name: my-vault-kms
      expectedError: "apiVersion"

    - name: Should reject pluginConfig with empty resource
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: ""
                name: my-vault-kms
      expectedError: "resource"

    - name: Should reject pluginConfig with empty name
      initial: |
        apiVersion: config.openshift.io/v1
        kind: APIServer
        spec:
          encryption:
            type: KMS
            kms:
              type: Vault
              pluginConfig:
                apiVersion: vault.hashicorp.io/v1
                resource: vaultkmsconfigs
                name: ""
      expectedError: "name"

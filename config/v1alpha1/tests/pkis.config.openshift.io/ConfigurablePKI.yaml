    - name: Should reject an empty namedCertificates list
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
            namedCertificates: []
      expectedError: "spec.certificates.namedCertificates in body should have at least 1 items"
    - name: Should reject a named key with an unprefixed name
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys:
            namedKeys:
              - name: bound-sa-signer
                key:
                  algorithm: ECDSA
                  ecdsa:
                    curve: P256
      expectedError: "spec.keys.namedKeys[0].name: Invalid value: \"string\": name must be a prefixed qualified name, for example openshift.io/etcd.signer"
    - name: Should reject an empty keys object
      initial: |
        apiVersion: config.openshift.io/v1alpha1
        kind: PKI
        metadata:
          name: cluster
        spec:
          certificates:
            defaults:
              key:
                algorithm: ECDSA
                ecdsa:
                  curve: P256
          keys: {}
      expectedError: "spec.keys.namedKeys: Required value"

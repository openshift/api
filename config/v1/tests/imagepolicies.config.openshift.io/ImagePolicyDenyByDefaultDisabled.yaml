apiVersion: apiextensions.k8s.io/v1
name: ImagePolicy
crdName: imagepolicies.config.openshift.io
featureGates:
- -ImagePolicyDenyByDefault
tests:
  onCreate:
  - name: Should reject policyType Reject when deny by default is disabled
    initial: |
      apiVersion: config.openshift.io/v1
      kind: ImagePolicy
      spec:
        scopes:
        - example.com
        policy:
          rootOfTrust:
            policyType: Reject
    expectedError: 'Unsupported value: "Reject"'

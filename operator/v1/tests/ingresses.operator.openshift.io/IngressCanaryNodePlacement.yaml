apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Ingress"
crdName: ingresses.operator.openshift.io
version: v1
featureGates:
- IngressCanaryNodePlacement
tests:
  onCreate:
  - name: Should be able to create an Ingress with canary nodePlacement tolerations
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoSchedule
  - name: Should not be able to create an Ingress with a wildcard toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - operator: Exists
    expectedError: "tolerations key must be non-empty"
  - name: Should be able to create an Ingress with tolerationSeconds on a NoExecute toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 60
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 60
  - name: Should be able to create an Ingress with duplicate tolerations
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
            - key: example.com/taint
              operator: Equal
              value: value-1
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
            - key: example.com/taint
              operator: Equal
              value: value-1
  - name: Should be able to create an Ingress with both canary and gatewayAPI configuration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
    expected: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        gatewayAPI:
          managementMode: Managed
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
  - name: Should not be able to create an Ingress with an unknown toleration operator
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Matches
              value: value-1
    expectedError: "tolerations operator must be 'Exists' or 'Equal'"
  - name: Should not be able to create an Ingress with an unknown toleration effect
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoOp
    expectedError: "tolerations effect must be 'NoSchedule', 'PreferNoSchedule', or 'NoExecute'"
  - name: Should not be able to create an Ingress with a value on an Exists toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Exists
              value: value-1
    expectedError: "tolerations value must be empty when operator is 'Exists'"
  - name: Should not be able to create an Ingress with an empty toleration key
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - operator: Equal
              value: value-1
    expectedError: "tolerations key must be non-empty"
  - name: Should not be able to create an Ingress with tolerationSeconds on a non-NoExecute toleration
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:
          nodePlacement:
            tolerations:
            - key: example.com/taint
              operator: Equal
              value: value-1
              effect: NoSchedule
              tolerationSeconds: 60
    expectedError: "tolerations effect must be 'NoExecute' when tolerationSeconds is set"
  - name: Should not be able to create an Ingress with more than 32 tolerations
    initial: |
      apiVersion: operator.openshift.io/v1
      kind: Ingress
      metadata:
        name: cluster
      spec:
        canary:

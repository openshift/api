apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/3126
    api.openshift.io/merged-by-featuregates: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-set: CustomNoUpgrade,DevPreviewNoUpgrade,TechPreviewNoUpgrade
  name: globalpullcredentials.config.openshift.io
spec:
  group: config.openshift.io
  names:
    kind: GlobalPullCredential
    listKind: GlobalPullCredentialList
    plural: globalpullcredentials
    singular: globalpullcredential
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GlobalPullCredential is a cluster-scoped resource declaring a single registry
          credential (one hostname per instance). A controller in machine-config-controller
          merges it into the controller-owned `openshift-config/pull-secret-merged` Secret
          without modifying the original `openshift-config/pull-secret`.

          Compatibility level 4: No compatibility is provided, the API can change at any point for any reason. These capabilities should not be used by applications needing long term support.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the registry credential contributed by this resource.
            properties:
              auth:
                description: auth holds the registry credential for this hostname.
                properties:
                  password:
                    description: |-
                      password is the base64-encoded registry password or token. The encoded
                      value is limited to 684 characters (512 decoded bytes).
                    format: byte
                    maxLength: 684
                    minLength: 1
                    type: string
                  username:
                    description: |-
                      username is the base64-encoded registry username. The decoded value must
                      not contain a colon because the controller constructs "username:password".
                      The encoded value is limited to 684 characters (512 decoded bytes).
                    format: byte
                    maxLength: 684
                    minLength: 1
                    type: string
                required:
                - password
                - username
                type: object
              hostname:
                description: |-
                  hostname is the registry host that this credential applies to, for example
                  "quay.io" or "registry.example.com:5000". Each hostname may only be claimed
                  by one GlobalPullCredential instance across the cluster.

                  The value must be a DNS hostname of one or more labels separated by dots.
                  Each label must start and end with an alphanumeric character and may contain
                  only alphanumeric characters or '-'. An optional numeric port may be appended
                  as ":{port}" and must be in the range 1 to 65535.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: hostname must start and end with an alphanumeric character,
                    and must only contain alphanumeric characters, '-' or '.'
                  rule: self.split(':')[0].matches('^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*$')
                - message: port must be between 1 and 65535
                  rule: '!self.contains('':'') || (self.split('':'').size() == 2 &&
                    self.split('':'')[1].matches(''^[0-9]+$'') && int(self.split('':'')[1])
                    >= 1 && int(self.split('':'')[1]) <= 65535)'
            required:
            - auth
            - hostname
            type: object
          status:
            description: status holds observed values from the cluster. They may not
              be overridden by user input.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions represent the latest available observations of this resource's state.
                  The known condition type is "Applied".
                  Applied=True means the controller merged the credential declared by this
                  generation into openshift-config/pull-secret-merged.
                  Applied=False means the credential was not merged. If the hostname overlaps
                  with the baseline pull-secret, the reason is BaselinePrecedence and the
                  baseline credential is used instead.
                  Applied=Unknown or an absent condition means no reconciliation result is available.
                  Applied does not indicate successful registry authentication or propagation to nodes.
                  When omitted, no observations are available. When present, the list must contain one condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
